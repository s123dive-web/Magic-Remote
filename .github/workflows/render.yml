name: Render remotes
# Draws each physical remote layout through FitScale at OnePlus Open screen sizes (desktop Compose, see
# tools/jvmcheck/render) and publishes the PNGs on the "renders" pre-release, so layout bugs show up without a phone.
on:
  push:
    branches: [ claude/build-this-e9qd88 ]
    paths:
      - 'app/src/main/java/in/s123dive/oneremote/ui/remote/**'
      - 'app/src/main/java/in/s123dive/oneremote/core/Command.kt'
      - 'tools/jvmcheck/**'
      - '.github/workflows/render.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle -p tools/jvmcheck render --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: remote-renders
          path: tools/jvmcheck/build/render/*.png
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: renders
          name: Remote layout renders
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: tools/jvmcheck/build/render/*.png
