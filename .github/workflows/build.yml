name: Build APK
on:
  push:
    branches: [ claude/build-this-e9qd88 ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        id: apk
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="OneRemote-${VER}-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: OneRemote
          path: ${{ steps.apk.outputs.name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OneRemote build ${{ github.run_number }}
          files: ${{ steps.apk.outputs.name }}
